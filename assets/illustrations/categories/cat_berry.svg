<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strawGrad" x1="14" y1="24" x2="38" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="60%" stop-color="#D50000" />
      <stop offset="100%" stop-color="#9B0000" />
    </linearGradient>
    <linearGradient id="bluebGrad1" x1="34" y1="32" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F51B5" />
      <stop offset="60%" stop-color="#1A237E" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="bluebGrad2" x1="28" y1="18" x2="48" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5C6BC0" />
      <stop offset="100%" stop-color="#283593" />
    </linearGradient>
    <linearGradient id="berryLeaf" x1="18" y1="14" x2="34" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#66BB6A" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="32" cy="57" rx="22" ry="4" fill="#0F172A" fill-opacity="0.12" />

  <!-- Blueberry Top-Right -->
  <g id="blueberrySmall">
    <circle cx="43" cy="28" r="9" fill="url(#bluebGrad2)" />
    <!-- Crown / Calyx Tip -->
    <circle cx="42" cy="24" r="2.5" fill="#1A237E" />
    <circle cx="42" cy="24" r="1.2" fill="#5C6BC0" opacity="0.6" />
    <!-- Bloom Highlight -->
    <path d="M46 25C48 27 49 31 48 33" stroke="#9FA8DA" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Blueberry Bottom-Right -->
  <g id="blueberryLarge">
    <circle cx="45" cy="44" r="11" fill="url(#bluebGrad1)" />
    <!-- Crown / Calyx Tip -->
    <circle cx="48" cy="41" r="3" fill="#0D47A1" />
    <circle cx="48" cy="41" r="1.5" fill="#7986CB" opacity="0.7" />
    <!-- Bloom Highlight -->
    <path d="M38 41C38 45 40 49 43 51" stroke="#C5CAE9" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Strawberry In Front -->
  <g id="strawberry">
    <!-- Strawberry Heart/Cone Body -->
    <path d="M14 26C13 36 21 48 26 53C31 48 39 36 38 26C37 21 15 21 14 26Z" fill="url(#strawGrad)" />
    
    <!-- Gloss Highlight -->
    <path d="M17 28C16 32 18 38 21 42" stroke="#FF8A80" stroke-width="2.2" stroke-linecap="round" opacity="0.75" />

    <!-- Yellow / Golden Seeds -->
    <ellipse cx="20" cy="29" rx="0.8" ry="1.4" transform="rotate(-15 20 29)" fill="#FFE082" />
    <ellipse cx="26" cy="28" rx="0.8" ry="1.4" fill="#FFE082" />
    <ellipse cx="32" cy="29" rx="0.8" ry="1.4" transform="rotate(15 32 29)" fill="#FFE082" />
    
    <ellipse cx="17" cy="35" rx="0.8" ry="1.4" transform="rotate(-20 17 35)" fill="#FFE082" />
    <ellipse cx="23" cy="35" rx="0.8" ry="1.4" transform="rotate(-5 23 35)" fill="#FFE082" />
    <ellipse cx="29" cy="35" rx="0.8" ry="1.4" transform="rotate(5 29 35)" fill="#FFE082" />
    <ellipse cx="34" cy="35" rx="0.8" ry="1.4" transform="rotate(20 34 35)" fill="#FFE082" />

    <ellipse cx="21" cy="42" rx="0.8" ry="1.4" transform="rotate(-10 21 42)" fill="#FFE082" />
    <ellipse cx="27" cy="42" rx="0.8" ry="1.4" transform="rotate(10 27 42)" fill="#FFE082" />
    <ellipse cx="31" cy="41" rx="0.8" ry="1.4" transform="rotate(15 31 41)" fill="#FFE082" />
    
    <ellipse cx="26" cy="48" rx="0.7" ry="1.2" fill="#FFE082" />

    <!-- Green Leaves Cap -->
    <path d="M26 23L29 18L26 21L23 18L26 23Z" fill="url(#berryLeaf)" />
    <path d="M26 23L34 20L31 22L36 24L26 23Z" fill="url(#berryLeaf)" />
    <path d="M26 23L18 20L21 22L16 24L26 23Z" fill="url(#berryLeaf)" />
    <!-- Stem -->
    <path d="M26 21C26.5 17 28 14 30 13" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>

